readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "opencv-python>=4.13.0.92",
    "optuna>=4.8.0",
    "pandas",
    "scikit-learn>=1.8.0",
    "torch>=2.6.0",
